name: Fluxos críticos
on:
  pull_request:
  push:
    branches-ignore: [gh-pages]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  critical:
    name: frontend-critical
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '20.19.5'
          cache: npm
      - run: npm ci
      - run: npm run test:critical
      - run: npx --no-install tsc --noEmit
      # Compile with a synthetic key; this artifact must never be deployed.
      # Production deploy separately requires its own real configuration.
      - run: npm run build
        env:
          REACT_APP_GOOGLE_MAPS_API_KEY: synthetic-ci-map-key-do-not-publish
